version: 2
models:
- name: console_pricing
  columns:
  - name: game_sk
    data_tests:
    - not_null
  - name: locale
    data_tests:
    - not_null
  - name: psn_price
    data_tests:
    - dbt_utils.accepted_range:
        min_value: 0
  - name: psn_currency
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      combination_of_columns:
      - game_sk
      - locale
- name: critic_reception
  columns:
  - name: game_sk
    data_tests:
    - not_null
    - unique
  - name: metacritic_score
    data_tests:
    - dbt_utils.accepted_range:
        min_value: 0
        max_value: 100
  - name: opencritic_score
    data_tests:
    - dbt_utils.accepted_range:
        min_value: 0
        max_value: 100
- name: game
  columns:
  - name: game_sk
    data_tests:
    - not_null
    - unique
  - name: title
    data_tests:
    - not_null
  - name: metacritic
    data_tests:
    - dbt_utils.accepted_range:
        min_value: 0
        max_value: 100
- name: traction
  columns:
  - name: game_sk
    data_tests:
    - not_null
    - unique
  - name: current_players
    data_tests:
    - dbt_utils.accepted_range:
        min_value: 0
  - name: peak_24h
    data_tests:
    - dbt_utils.accepted_range:
        min_value: 0
  - name: peak_all
    data_tests:
    - dbt_utils.accepted_range:
        min_value: 0
- name: market_features
  columns:
  - name: game_sk
    data_tests:
    - not_null
    - unique
    - relationships:
        to: ref('game')
        field: game_sk
  - name: popularity_score
    data_tests:
    - not_null
    - dbt_utils.accepted_range:
        min_value: 0
  - name: critic_score
    data_tests:
    - dbt_utils.accepted_range:
        min_value: 0
        max_value: 1
  - name: metacritic_score
    data_tests:
    - dbt_utils.accepted_range:
        min_value: 0
        max_value: 100
  - name: opencritic_score
    data_tests:
    - dbt_utils.accepted_range:
        min_value: 0
        max_value: 100
  - name: avg_critic_score
    data_tests:
    - dbt_utils.accepted_range:
        min_value: 0
        max_value: 100
  - name: psn_price_usd
    data_tests:
    - dbt_utils.accepted_range:
        min_value: 0
  - name: psn_currency
  - name: peak_players
    data_tests:
    - dbt_utils.accepted_range:
        min_value: 0
  - name: has_critic_reception
    data_tests:
    - not_null
  - name: has_console_pricing
    data_tests:
    - not_null
  - name: has_traction
    data_tests:
    - not_null
  data_tests:
  - dbt_expectations.expect_table_row_count_to_be_between:
      min_value: 1
- name: metacritic__game
  description: Layer-0 registration of the immutable Metacritic games Parquet (1:1
    AS-IS).
  columns:
  - name: slug
    data_tests:
    - not_null
  - name: content_hash
    data_tests:
    - not_null
  - name: source_url
    data_tests:
    - not_null
- name: opencritic__game
  description: Layer-0 registration of the immutable OpenCritic games Parquet (1:1
    AS-IS).
  columns:
  - name: game_id
    data_tests:
    - not_null
  - name: content_hash
    data_tests:
    - not_null
  - name: source_url
    data_tests:
    - not_null
- name: psn__concept
  description: Layer-0 registration of the immutable PSN concept Parquet (1:1 AS-IS).
  columns:
  - name: row_key
    data_tests:
    - not_null
  - name: content_hash
    data_tests:
    - not_null
  - name: source_url
    data_tests:
    - not_null
- name: rawg__games
  description: Layer-0 registration of the immutable RAWG games Parquet (1:1 AS-IS).
  columns:
  - name: id
    data_tests:
    - not_null
- name: steamcharts__app
  description: Layer-0 registration of the immutable SteamCharts app Parquet (1:1
    AS-IS).
  columns:
  - name: appid
    data_tests:
    - not_null
  - name: content_hash
    data_tests:
    - not_null
  - name: source_url
    data_tests:
    - not_null
- name: stg_game_match
  columns:
  - name: game_sk
    data_tests:
    - not_null
    - unique
  - name: match_key
    data_tests:
    - not_null
- name: stg_games
  columns:
  - name: game_id
    data_tests:
    - not_null
    - unique
  - name: name
    data_tests:
    - not_null
  - name: ratings_count
    data_tests:
    - dbt_utils.accepted_range:
        min_value: 0
  - name: playtime_hours
    data_tests:
    - dbt_utils.accepted_range:
        min_value: 0
  - name: added_count
    data_tests:
    - dbt_utils.accepted_range:
        min_value: 0
- name: stg_metacritic_games
  columns:
  - name: slug
    data_tests:
    - not_null
    - unique
  - name: name
    data_tests:
    - not_null
  - name: metascore
    data_tests:
    - dbt_utils.accepted_range:
        min_value: 0
        max_value: 100
  - name: review_count
    data_tests:
    - dbt_utils.accepted_range:
        min_value: 0
- name: stg_opencritic_games
  columns:
  - name: game_id
    data_tests:
    - not_null
    - unique
  - name: name
    data_tests:
    - not_null
  - name: score
    data_tests:
    - dbt_utils.accepted_range:
        min_value: 0
        max_value: 100
  - name: review_count
    data_tests:
    - dbt_utils.accepted_range:
        min_value: 0
- name: stg_psn_concepts
  columns:
  - name: row_key
    data_tests:
    - not_null
    - unique
  - name: name
    data_tests:
    - not_null
  - name: price
    data_tests:
    - dbt_utils.accepted_range:
        min_value: 0
- name: stg_steamcharts_apps
  columns:
  - name: appid
    data_tests:
    - not_null
    - unique
  - name: current_players
    data_tests:
    - dbt_utils.accepted_range:
        min_value: 0
  - name: peak_24h
    data_tests:
    - dbt_utils.accepted_range:
        min_value: 0
  - name: peak_all
    data_tests:
    - dbt_utils.accepted_range:
        min_value: 0
unit_tests:
- name: popularity_score_is_zero_when_rating_is_zero
  given:
  - input: ref('game')
    rows:
    - game_sk: a
      game_id: 1
      title: t
      release_year: 2020
      rating: 0.0
      ratings_count: 500
      metacritic: 80
      playtime_hours: 1
      added_count: 1
  - input: ref('critic_reception')
    rows: []
  - input: ref('console_pricing')
    rows: []
  - input: ref('traction')
    rows: []
  expect:
    rows:
    - game_sk: a
      popularity_score: 0.0
  model: market_features
