odos: 0.1
group: maintenance
doc: Keeping the generated dbt subproject and its packages healthy.

jobs:
  update_dbt_job:
    task: dbt.parse
    tags: {maintenance: dbt}
    doc: "Regenerate the dbt project from `spec/`, install packages (`dbt
      deps`), and `dbt parse` — refreshes the manifest without running models."
  update_dbt_changed_job:
    task: dbt.build
    args: {select: "state:modified+", state: "."}
    tags: {maintenance: dbt}
    doc: "Regenerate from `spec/` and build only the models a change touched
      (`dbt build --select state:modified+`)."
  dbt_project_evaluator_job:
    task: dbt.build
    args: {select: "package:dbt_project_evaluator"}
    tags: {maintenance: dbt, package: dbt_project_evaluator}
    doc: "Audit the generated dbt project with dbt_project_evaluator — flags
      modeling, testing, documentation and DAG anti-patterns (warns, does not
      block)."

automations:
  daily_dbt_subproject_update:
    on: cron("0 2 * * *")
    run: update_dbt_job
    doc: "Daily (02:00) regenerate-from-spec + `dbt deps` + parse."
  weekly_dbt_project_evaluator:
    on: cron("0 4 * * 1")
    run: dbt_project_evaluator_job
    doc: "Weekly (Mon 04:00) dbt project audit."
  spec_change_updates_dbt:
    on: poll(sensors.spec_sql_mtime, every=30s)
    run: update_dbt_changed_job
    doc: "Watch `spec/sql` mtimes; on a change, regenerate the dbt subproject
      and rebuild only the changed models."
